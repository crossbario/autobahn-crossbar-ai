# The gate for this repository's own code: the same `just check` / `just test` the
# control node and the maintainer's dev PC run (triple testing). Each recipe creates
# its venv from the standard map (cpy311..cpy314, pypy311). Read-only token, no secrets.

name: check

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: just check cpy311 (lint, format, types, tests + coverage)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - uses: extractions/setup-just@v3
      - run: just check cpy311

  test:
    name: just test ${{ matrix.venv }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        venv: [cpy311, cpy312, cpy313, cpy314, pypy311]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - uses: extractions/setup-just@v3
      - run: just test ${{ matrix.venv }}
